services:
  api:
    volumes:
      - type: bind
        source: ./backend_python/app
        target: /app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    volumes:
      - type: bind
        source: ./frontend_php
        target: /app
    command: ["php", "-S", "0.0.0.0:8080", "-t", "public"]
