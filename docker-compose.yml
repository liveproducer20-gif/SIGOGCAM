name: sigo-gcam

services:
  database:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04}
    container_name: sigo-gcam-database
    hostname: database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en el archivo .env}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - type: bind
        source: ./Backup
        target: /var/opt/mssql/backup
        read_only: true
      - type: bind
        source: ./docker/database/mssql.conf
        target: /var/opt/mssql/mssql.conf
        read_only: true
    networks:
      - sigo_network
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  database-init:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04}
    container_name: sigo-gcam-database-init
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en el archivo .env}
      DB_DATABASE: ${DB_DATABASE:-BITSAC}
      DB_BACKUP_FILE: ${DB_BACKUP_FILE:-BITSAC2}
    volumes:
      - type: bind
        source: ./Backup
        target: /var/opt/mssql/backup
        read_only: true
      - type: bind
        source: ./docker/database
        target: /docker-entrypoint-initdb.d
        read_only: true
    networks:
      - sigo_network
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/init-database.sh"]
    restart: "no"

  api:
    build:
      context: ./backend_python
      dockerfile: Dockerfile
    container_name: sigo-gcam-api
    environment:
      APP_ENV: production
      API_PREFIX: /api
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_SERVER: database
      DB_DATABASE: ${DB_DATABASE:-BITSAC}
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en el archivo .env}
      DB_TRUSTED_CONNECTION: "no"
      DB_ENCRYPT: "yes"
      DB_TRUST_SERVER_CERTIFICATE: "yes"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - sigo_network
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/probar-db', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend_php
      dockerfile: Dockerfile
    container_name: sigo-gcam-web
    environment:
      APP_ENV: production
      API_BASE_URL: http://api:8000/api
      SESSION_NAME: sigo_gcam_session
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - sigo_network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  sigo_network:
    name: sigo-gcam-network
    driver: bridge

volumes:
  sqlserver_data:
    name: sigo-gcam-sqlserver-data
